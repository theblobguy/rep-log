<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f12;--card:#17191e;--card2:#20232a;--line:#2b2f38;--txt:#eef0f3;--mut:#8b919c;--acc:#f2c14e;--accd:#2e2410;--red:#ff6b6b;--yel:#ff9f43;--blu:#7aa7ff;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif}
body{padding:calc(var(--st) + 8px) 0 calc(84px + var(--sb))}
body.resting{padding-bottom:calc(160px + var(--sb))}
#app{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px;margin:22px 2px 10px}
.eyebrow{color:var(--acc);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 2px 14px}
.top.wk{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:calc(var(--st) + 10px);margin-top:calc(-1 * var(--st) - 8px);border-bottom:1px solid var(--line);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ttl{font-weight:700;font-size:16px}
.row{display:flex;gap:8px;align-items:center}.row.tight{gap:2px}
.row>.btn{flex:1}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 14px;font:600 15px Inter,sans-serif;color:var(--txt);background:var(--card2);cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.acc{background:var(--acc);color:var(--acct)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--redb)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:14px}
.btn.full{width:100%;margin-top:8px}
.btn.sm{padding:9px 12px;font-size:14px}
.ic{background:none;border:0;color:var(--mut);font-size:18px;min-width:34px;height:34px;border-radius:9px;cursor:pointer;flex:none}
.ic:active{background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.pill.ok i{background:var(--acc)}.pill.busy i{background:var(--yel)}.pill.bad i{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font:700 28px "Barlow Condensed",sans-serif;color:var(--acc)}
.stat span{font-size:12px;color:var(--mut)}
.rt .mut{margin:4px 0 12px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.ex-h .ttl{color:var(--acc)}
.ex.ss{border-left:3px solid var(--blu)}
.sstag{font-size:11px;font-weight:700;color:var(--blu);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.bump{font-size:12px;color:var(--acc);margin-top:2px}
.exnote{font-size:13px;color:var(--yel);margin-top:3px;white-space:pre-wrap}
.sr{display:grid;grid-template-columns:34px 1fr 70px 62px 44px;gap:6px;align-items:center;padding:4px 0;border-radius:10px}
.sr.hd{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;padding-bottom:2px}
.sr.hd span{text-align:center}.sr.hd span:nth-child(2){text-align:left}
.sr.done{background:var(--accd)}
.sn{text-align:center;font-weight:700;color:var(--mut);cursor:pointer;padding:8px 0;border-radius:8px}
.sn.k-w{color:var(--yel)}.sn.k-d{color:var(--blu)}.sn.k-f{color:var(--red)}
.prev{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{font:500 16px Inter,sans-serif;color:var(--txt);background:var(--card2);border:1px solid transparent;border-radius:10px;padding:9px 8px;width:100%;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}

.sr input{text-align:center;padding:8px 2px}
.sr.done input{background:var(--accd2)}
.chk,.swb{height:38px;border:0;border-radius:10px;background:var(--card2);color:var(--mut);font-size:17px;font-weight:700;cursor:pointer;width:100%}
.swb{color:var(--acc)}
.sr.done .chk{background:var(--acc);color:var(--acct)}
.title-in{background:none;font:700 26px "Barlow Condensed",sans-serif;padding:0;border:0;border-bottom:1px dashed transparent;border-radius:0}
.title-in:focus{border-bottom-color:var(--acc)}
textarea.note{min-height:64px;font-size:14px;margin:6px 0 10px;resize:vertical}
.search{margin-bottom:6px}
.hint{font-size:12px;color:var(--mut);text-align:center;margin:12px 0}
.lbl{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 2px}
.fld{display:block;flex:1;font-size:12px;color:var(--mut)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--sb));z-index:20}

nav button.on{color:var(--acc)}
nav .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);position:absolute;top:2px;left:calc(50% + 8px)}
#restbar{position:fixed;left:10px;right:10px;bottom:calc(72px + var(--sb));max-width:540px;margin:0 auto;background:var(--accd);border:1px solid var(--accb);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:8px;z-index:19;overflow:hidden}
#restbar.on{display:flex}
#rest-p{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width .25s linear}
#rest-t{font:700 30px "Barlow Condensed",sans-serif;color:var(--acc);min-width:66px}
#restbar .lbl2{font-size:12px;color:var(--mut);flex:1;line-height:1.2;overflow:hidden}
#restbar button{background:var(--accd2);border:0;color:var(--txt);border-radius:9px;padding:8px 10px;font:600 13px Inter;cursor:pointer;flex:none}
.sw{position:fixed;inset:0;background:var(--ovbg);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.sw.on{display:flex}
.sw-t{font:700 96px "Barlow Condensed",sans-serif;color:var(--acc);line-height:1}
.sw.hit .sw-t{color:var(--txt)}
.sw-l{color:var(--mut);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;visibility:hidden;pointer-events:none;align-items:flex-end;justify-content:center;z-index:50;transition:background-color .34s var(--eo),visibility 0s linear .42s}
.modal.on{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.55);transition:background-color .34s var(--eo),visibility 0s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--sb));border-top:1px solid var(--line);transform:translateY(105%);transition:transform .44s var(--edr);will-change:transform;overscroll-behavior:contain}
.modal.on .sheet{transform:none}.sheet.drag{transition:none}.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}

.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}

.menu{display:flex;flex-direction:column;margin-top:8px}
.menu button{background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);text-align:left;padding:14px 4px;font:500 16px Inter;cursor:pointer}
.menu button.red{color:var(--red)}
.rxf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rxf label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.rxf input{text-align:center;margin-top:3px}
.hc{cursor:pointer}
.hc .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut);margin:4px 0 8px}
.hc .lines{font-size:14px;color:var(--txt2)}
canvas{width:100%;height:190px;display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.kv b{display:block;font:700 22px "Barlow Condensed",sans-serif}
.kv span{font-size:11px;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 6px;border-radius:9px;font:600 14px Inter;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acct)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 12px}
.tog{flex:none;width:50px;height:30px;border-radius:999px;border:0;background:var(--card2);position:relative;cursor:pointer}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:transform .26s var(--eo),background-color .2s}
.tog.on{background:var(--acc)}.tog.on::after{transform:translateX(20px);background:var(--acct)}
textarea.bk{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.pr{color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:var(--acc);color:var(--acct);font-weight:700;padding:10px 14px;border-radius:12px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.on{opacity:1}.toast.act{pointer-events:auto}
.toast button{background:var(--acct);color:var(--acc);border:0;border-radius:8px;padding:6px 10px;font:700 13px Inter;cursor:pointer}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--txt);font:500 22px Inter;cursor:pointer}
.tool b{display:block;font-size:14px;margin-top:6px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;margin:10px 0 4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat i.l1{background:var(--acc2)}.heat i.l2{background:var(--acc)}.heat i.f{background:transparent}
.rirq{background:var(--card2);border-radius:12px;padding:8px 10px;margin:6px 0 2px}.rirb{display:flex;gap:6px;margin-top:6px}.rirb button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:8px 0;font:700 15px Inter,sans-serif;cursor:pointer}.rirb button.on{background:var(--acc);color:#111}.rirb button.x{flex:none;width:40px;color:var(--mut)}.rirb.big button{padding:16px 0;font-size:22px}
.sn .rr{display:block;font-style:normal;font-size:9px;color:var(--acc);line-height:1;margin-top:1px}
.stall{border-color:var(--warnb);background:var(--warnbg)}.tip{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.tip:last-child{border:0}.tip b{color:var(--yel)}
.stalltag{font-size:12px;color:var(--yel);margin-top:3px;cursor:pointer}.red{color:var(--red)}
.cklist{margin:6px 0 10px;padding-left:18px;font-size:14px}.cklist li{margin:5px 0}
body.gymon{overflow:hidden}
.gym{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;gap:10px;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 16px);overflow-y:auto;max-width:560px;margin:0 auto}.gym.on{display:flex}
.gtop{display:flex;justify-content:space-between;align-items:center}.gname{font:700 34px "Barlow Condensed",sans-serif;text-align:center;line-height:1.05}.gset{text-align:center;font-weight:700;color:var(--acc)}.gset.w{color:var(--yel)}
.gbig{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}.glbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;text-align:center}
.gval{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;margin-top:4px}.gval button{height:72px;border:0;border-radius:16px;background:var(--card2);color:var(--txt);font:600 36px Inter,sans-serif;cursor:pointer}.gval button:active{background:var(--accd)}
.gval input{text-align:center;font:700 52px "Barlow Condensed",sans-serif;padding:4px 0;background:none}
.gload{text-align:center;font-size:14px;color:var(--txt);min-height:18px}.gplates{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.gplates button{flex:1;min-width:56px;padding:14px 0;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;font:700 16px Inter,sans-serif;cursor:pointer}
.gdo{font-size:22px;padding:20px}.gdone{text-align:center;font:700 26px "Barlow Condensed",sans-serif}.gnav{display:flex;gap:8px;margin-top:auto}.gnav .btn{flex:1}
.grest{text-align:center;background:var(--accd);border:1px solid var(--accb);border-radius:18px;padding:10px}#gymrest{font:700 56px "Barlow Condensed",sans-serif;color:var(--acc)}
.cam{position:fixed;inset:0;z-index:65;background:#000;display:none}.cam.on{display:block}.camview{position:absolute;inset:0}.camview video,.camview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.camview .mir{transform:scaleX(-1)}
.camcd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 120px "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 2px 20px #000;pointer-events:none}
.camerr{position:absolute;left:20px;right:20px;top:40%;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center}
.camtop{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.6),transparent)}.camtop .ic{color:#fff}
.cambot{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(var(--sb) + 18px);background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;flex-direction:column;gap:12px}
.camop{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}.camop input{flex:1}.camrow{display:flex;justify-content:space-between;align-items:center}.camrow .chips{justify-content:center;width:100%}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}.shutter:active{background:var(--acc)}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.thsw{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:2px solid;border-radius:14px;padding:10px;cursor:pointer;text-align:left;font-family:Inter,sans-serif}.thsw b{font-size:14px}.thsw small{font-size:11px;line-height:1.3}.thdots{display:flex;gap:4px;margin-bottom:4px}.thdots i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.chips.rng{margin:10px 0 4px}
.kv.k4{grid-template-columns:repeat(2,1fr)}.kv em{display:block;font-style:normal;font-size:11px;font-weight:600;margin-top:3px;color:var(--mut)}.kv em.up{color:var(--acc)}
.rdo{display:flex;align-items:baseline;gap:8px;margin:8px 0 4px;min-height:28px;min-width:0}.rdo b{font:700 24px "Barlow Condensed",sans-serif;flex:none}.rdo span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
canvas.chart{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.seg.sm2 button{padding:7px 4px;font-size:13px}
.chg{font-size:13px;font-weight:600;margin-top:8px}.chg.up{color:var(--acc)}.chg.dn{color:var(--red)}.acc{color:var(--acc)}
.lift{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}.lift canvas{height:34px}
.hleg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin:2px 0 8px}.hleg i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--mapn),var(--acc2),var(--acc))}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.pgrid button{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--card2);cursor:pointer}.pgrid img{width:100%;height:100%;object-fit:cover;display:block}.pgrid span{position:absolute;left:0;right:0;bottom:0;font:600 10px Inter,sans-serif;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:12px 5px 4px;text-align:left}
.phprev{display:block;max-height:46vh;max-width:100%;margin:6px auto 4px;border-radius:12px}.phfull{display:block;width:100%;max-height:68vh;object-fit:contain;border-radius:12px;margin:10px 0;background:#000}
.cmp{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4;margin:10px 0 6px;max-height:62vh;width:100%}.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.cmp .top{clip-path:inset(0 calc(100% - var(--p)) 0 0)}.cmp .ln{position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--acc);transform:translateX(-1px)}.cmp .tg{position:absolute;top:8px;font:700 11px Inter,sans-serif;color:#fff;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:6px}
input[type=range]{accent-color:var(--acc);padding:0;background:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbar{display:grid;grid-template-columns:80px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:6px 0}

.mbar b{text-align:right}
.rm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.rm div{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut)}
.rm b{display:block;color:var(--txt);font-size:15px}
.bar-vis{display:flex;align-items:center;justify-content:center;height:150px;margin:14px 0 8px}

.bar-col{width:10px;height:40px;background:#b8bec6;border-radius:2px;margin-right:2px}

.bar-end{width:30px;height:14px;background:#9aa0a8;border-radius:0 3px 3px 0}

function fmtClock(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600);return h?h+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60):Math.floor(s/60)+':'+pad(s%60)}
function fmtDur(ms){const m=Math.round(ms/60000),h=Math.floor(m/60);return h?h+'h '+pad(m%60)+'m':m+' min'}
function fmtElapsed(ms){return fmtClock(Math.floor(ms/1000))}
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtDateY=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtNum=n=>Math.round(n).toLocaleString();
const e1rm=(w,r)=>w>0&&r>0?(r===1?w:w*(1+r/30)):0;
const WU=()=>S.settings.units;
const DU=()=>S.settings.units==='kg'?'km':'mi';
function exById(id){return EXMAP.get(id)||S.customEx.find(e=>e.id===id)||{id,name:'Deleted exercise',group:'Custom',type:'wr'}}
const exName=id=>exById(id).name;
const exType=id=>exById(id).type||'wr';
const isW=s=>(s.k||'')==='w';
function fmtSet(type,s){
  if(!s)return'—';
  const w=num(s.w),r=num(s.r),t=num(s.t),d=num(s.d);
  switch(type){
    case 'bw':return w?`+${R2(w)}×${r}`:`${r} reps`;
    case 't':return fmtClock(t);
    case 'dt':return `${R2(d)} ${DU()}${t?' · '+fmtClock(t):''}`;
    default:return `${R2(w)}×${r}`;
  }
}
function score(type,s){const w=num(s.w),r=num(s.r);switch(type){case 'bw':return r;case 't':return num(s.t);case 'dt':return num(s.d);default:return e1rm(w,r)}}
function fmtScore(type,v){switch(type){case 'bw':return v+' reps';case 't':return fmtClock(v);case 'dt':return R2(v)+' '+DU();default:return 'est. 1RM '+R2(v)+' '+WU()}}
function setVol(type,s){return (type==='wr'||type==='bw')&&!isW(s)?num(s.w)*num(s.r):0}
function hasValue(s){return ['w','r','t','d'].some(k=>num(s[k])>0)}
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weekCount(){const ws=weekStart(Date.now());return S.history.filter(h=>h.date>=ws).length}
function streak(){const weeks=new Set(S.history.map(h=>weekStart(h.date)));let w=weekStart(Date.now()),n=0;if(!weeks.has(w))w=weekStart(w-3*864e5);while(weeks.has(w)){n++;w=weekStart(w-3*864e5)}return n}
function lastEntry(exId,excludeId){for(const h of S.history){if(h.id===excludeId)continue;const e=h.exercises.find(x=>x.exId===exId);if(e&&e.sets.length)return e}return null}
function sortHistory(){S.history.sort((a,b)=>b.date-a.date)}

function heatmap(){
  const counts={};S.history.forEach(h=>{const k=dayKey(h.date);counts[k]=(counts[k]||0)+1});
  const start=new Date(weekStart(Date.now()));start.setDate(start.getDate()-17*7);const today=new Date();today.setHours(23,59,59,999);let cells='';
  for(let i=0;i<18*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const c=counts[dayKey(d)]||0;cells+=`<i class="${d>today?'f':c>1?'l2':c?'l1':''}"></i>`}
  return `<div class="heat">${cells}</div>`;
}

function periodStats(from,to){let n=0,vol=0,sets=0,dur=0;S.history.forEach(h=>{if(h.date<from||h.date>=to)return;n++;dur+=h.dur||0;h.exercises.forEach(e=>{const t=exType(e.exId);e.sets.forEach(s=>{if(isW(s))return;sets++;vol+=setVol(t,s)})})});return{n,vol,sets,dur}}
function streaks(){const wk=new Set(S.history.map(h=>weekStart(h.date)));let cur=0,t=weekStart(Date.now());if(!wk.has(t))t=weekStart(t-3*864e5);while(wk.has(t)){cur++;t=weekStart(t-3*864e5)}
  const all=[...wk].sort((a,b)=>a-b);let best=0,run=0,prev=0;all.forEach(w=>{run=prev&&weekStart(prev+10*864e5)===w?run+1:1;best=Math.max(best,run);prev=w});return{cur,best,thisWeek:S.history.filter(h=>h.date>=weekStart(Date.now())).length}}
function buckets(){
  const from=rangeStart(),now=Date.now(),monthly=(now-from)>420*864e5,out=[];
  if(monthly){const d=new Date(from);d.setDate(1);d.setHours(0,0,0,0);while(d.getTime()<=now){const a=d.getTime();d.setMonth(d.getMonth()+1);out.push({x:a,to:d.getTime(),lab:new Date(a).toLocaleDateString(undefined,{month:'long',year:'numeric'}),xl:new Date(a).toLocaleDateString(undefined,{month:'short'})})}}
  else{let a=weekStart(from);while(a<=now){const b=weekStart(a+10*864e5);out.push({x:a,to:b,lab:'Week of '+new Date(a).toLocaleDateString(undefined,{month:'short',day:'numeric'}),xl:new Date(a).toLocaleDateString(undefined,{month:'numeric',day:'numeric'})});a=b}}

function delta(cur,prev,good){if(rangeAll()||!prev)return '<em>&nbsp;</em>';const p=Math.round((cur-prev)/prev*100);return `<em class="${p>0&&good?'up':''}">${p>0?'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5l5-5 5 5z" class="fi"/></svg>':p<0?'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9.5l5 5 5-5z" class="fi"/></svg>':''} ${Math.abs(p)}% vs prior</em>`}
function prEvents(){const ev=[],best={};[...S.history].reverse().forEach(h=>h.exercises.forEach(e=>{const t=exType(e.exId);const v=Math.max(0,...e.sets.filter(s=>!isW(s)).map(s=>score(t,s)));if(!v)return;const b=best[e.exId];if(b&&v>b+1e-9)ev.push({date:h.date,id:e.exId,t,v,prev:b});if(!b||v>b)best[e.exId]=v}));return ev.reverse()}
function muscleAvg(){const from=rangeStart(),weeks=Math.max(1,(Date.now()-from)/6048e5),v={};S.history.forEach(h=>{if(h.date<from)return;h.exercises.forEach(e=>{const m=musclesOf(e.exId),n=e.sets.filter(s=>!isW(s)).length;m.p.forEach(x=>v[x]=(v[x]||0)+n);m.s.forEach(x=>v[x]=(v[x]||0)+n/2)})});for(const k in v)v[k]/=weeks;return v}

const PH={list:null,err:'',loading:false};
const PDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);let r;try{r=indexedDB.open('replog-photos',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>{try{r.result.createObjectStore('p',{keyPath:'id'})}catch(e){}};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error||new Error('Storage unavailable'))})},

const R1c=n=>Math.round(n*10)/10;
function avgOf(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function effortOn(){return S.settings.effort!==false}

/* ---------- effort: reps in reserve ---------- */
function rirAsk(e,i){
  if(!effortOn())return '';const t=exType(e.exId);if(t!=='wr'&&t!=='bw')return '';
  let j=-1;e.sets.forEach((s,k)=>{if(s.done&&!isW(s))j=k});if(j<0)return '';const s=e.sets[j];if(hasRir(s)||s.rirx)return '';
  let n=0;for(let k=0;k<=j;k++)if(!isW(e.sets[k]))n++;
  return `<div class="rirq"><div class="sm"><b>Set ${n}:</b> how many more reps could you have done?</div><div class="rirb">${[0,1,2,3,4].map(v=>`<button data-act="rir" data-i="${i}" data-j="${j}" data-v="${v}">${v===4?'4+':v}</button>`).join('')}<button class="x" data-act="rir" data-i="${i}" data-j="${j}" data-v="x" aria-label="Skip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div></div>`;
}
const rirTag=s=>s.done&&hasRir(s)?`<i class="rr">${+s.rir>=4?'4+':+s.rir}</i>`:'';

/* ---------- warm-up generator ---------- */
function wuRound(id,w){const kg=WU()==='kg',eq=equipOf(id);const st=/Dumbbell/.test(eq)?(kg?2:5):(kg?2.5:5);return Math.max(0,Math.round(w/st)*st)}
function warmupPlan(a,i){
  const e=a.exercises[i],id=e.exId;const j=e.sets.findIndex(s=>!isW(s));if(j<0)return{err:'Add a working set first'};
  const W=num(e.sets[j].w)||suggestion(e,j).out.w;if(!W)return{err:'Enter your working weight first'};
  const bar=isLoadable(id)?barCfg(id).bar:0,kind=exKind(id),mine=musclesOf(id).p;
  const warm=a.exercises.slice(0,i).some(x=>x.sets.some(s=>s.done)&&musclesOf(x.exId).p.some(m=>mine.includes(m)));
  let steps,why;
  if(kind==='iso'){steps=[[.5,10]];why='one light set to groove the movement'}
  else if(warm){steps=[[.7,4]];why='one set — these muscles are already warm from earlier'}
  else if(bar&&W>=bar*2.2){steps=[[0,8,1],[.4,6],[.6,4],[.8,2]];why='empty bar, then ramping to ~80% of your working weight'}

}
function addWarmups(i){const a=S.active,e=a.exercises[i];const p=warmupPlan(a,i);if(p.err){toast(p.err);return}
  e.sets.splice(0,0,...p.sets.map(x=>Object.assign(newSet(x.r,'w'),{w:String(x.w),r:String(x.r)})));saveActive();render();
  toast(`Added ${p.sets.length} warm-up set${p.sets.length>1?'s':''}: ${p.why}`)}

/* ---------- plateau detection ---------- */
function plateauOf(id){
  if(exType(id)!=='wr')return null;const ses=sessionsFor(id).filter(s=>s.date>=Date.now()-150*864e5);if(ses.length<5)return null;
  const last=ses[ses.length-1];if(Date.now()-last.date>28*864e5)return null;
  const best=Math.max(...ses.map(s=>s.e1)),bi=ses.findIndex(s=>s.e1>=best*.995),since=ses.length-1-bi;
  if(since<3)return null;return{since,best:ses[bi],ses,weeks:(last.date-ses[bi].date)/6048e5};
}
function plateauTips(id,pl){
  const tips=[],m=musclesOf(id).p,from=Date.now()-21*864e5,tg=hasGoal()?weeklySetTarget():[10,20];
  let sets=0;S.history.forEach(h=>{if(h.date<from)return;h.exercises.forEach(e=>{const mm=musclesOf(e.exId),n=e.sets.filter(s=>!isW(s)).length;m.forEach(x=>{if(mm.p.includes(x))sets+=n;else if(mm.s.includes(x))sets+=n/2})})});
  sets=m.length?sets/m.length/3:0;const mn=m.map(x=>MUS[x].toLowerCase()).join(' & ');
  if(m.length&&sets<tg[0]-1)tips.push(['Add a few sets',`Your ${mn} averaged ${R1c(sets)} hard sets a week lately, under the ${tg[0]}–${tg[1]} target. Add 2–4 sets a week — more volume is the most reliable driver of progress.`]);
  const rr=pl.ses.slice(-3).flatMap(s=>s.sets.filter(hasRir).map(x=>+x.rir)),ar=avgOf(rr);
  if(rr.length>=3&&ar>=3)tips.push(['Push a little closer to failure',`You’ve been stopping with about ${R1c(ar)} reps left. Aim for 1–2 in the tank on your working sets.`]);
  else if(rr.length>=3&&ar<=.5)tips.push(['Back off from failure',`Most recent sets went to failure. Stopping 1–2 reps short lets you recover between sessions and add weight more steadily.`]);
  const bw=S.bw.filter(b=>b.date>=Date.now()-35*864e5);
  if(bw.length>=3){const span=(bw[bw.length-1].date-bw[0].date)/6048e5;if(span>=1.5){const ch=(bw[bw.length-1].w-bw[0].w)/bw[0].w/span;if(ch<-.005)tips.push(['You’re losing weight',`Body weight is down about ${R1c(-ch*100)}% a week. Strength often stalls in a calorie deficit — holding your numbers is a win until you eat at maintenance again.`])}}
  const l3=pl.ses.slice(-3);if(new Set(l3.map(s=>s.w)).size===1)tips.push(['Use double progression',`Same top weight for your last 3 sessions. Keep it and add a rep to each set per session; once every set hits the top of your rep range, add ${R2(num(S.settings.inc))} ${WU()}.`]);
  if(pl.since>=5||pl.weeks>=4)tips.push(['Take a lighter week',`A stall lasting a month or more often clears after a deload: about a week with roughly half the sets. Coaches typically schedule one every 4–6 weeks.`]);
  const alt=(swapOptions(id,[]).find(x=>famOf(x.id)!==famOf(id))||swapOptions(id,[])[0]);
  if(alt)tips.push(['Or rotate in a variation',`Swap to ${exName(alt.id)} for 4–6 weeks, then come back. A fresh movement often breaks a stall.`]);
  return tips;
}
function plateauCard(id){const pl=plateauOf(id);if(!pl)return '';
  return `<div class="card stall"><div class="ttl"><svg class="i warnc" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.6 3.2 17.2A2 2 0 0 0 5 20h14a2 2 0 0 0 1.8-2.8L13.7 4.6a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 16.6v.1"/></svg> No new best in ${pl.since} sessions</div><div class="mut sm">Best est. 1RM ${R1c(pl.best.e1)} ${WU()} on ${fmtDate(pl.best.date)}. What might help:</div>${plateauTips(id,pl).map(([t,d])=>`<div class="tip"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('')}</div>`}

/* ---------- weekly check-in & deloads ---------- */
const MAJOR=['chest','lats','upback','sdelt','quads','hams','glutes','biceps','triceps'];
function inDeload(){return num(S.settings.deloadUntil)>Date.now()}
function checkin(){
  if(!hasGoal())return null;const b=weekStart(Date.now()),a=weekStart(b-3*864e5);
  if(!S.history.some(h=>h.date<a))return null;
  const wk=S.history.filter(h=>h.date>=a&&h.date<b),tg=weeklySetTarget(),v={};
  wk.forEach(h=>h.exercises.forEach(e=>{const m=musclesOf(e.exId),n=e.sets.filter(s=>!isW(s)).length;m.p.forEach(x=>v[x]=(v[x]||0)+n);m.s.forEach(x=>v[x]=(v[x]||0)+n/2)}));
  const perf=[];[...new Set(wk.flatMap(h=>h.exercises.map(e=>e.exId)))].filter(id=>exType(id)==='wr').forEach(id=>{const s=sessionsFor(id),cur=s.filter(x=>x.date>=a&&x.date<b),prev=s.filter(x=>x.date<a&&x.date>=a-28*864e5);if(!cur.length||!prev.length)return;const c=Math.max(...cur.map(x=>x.e1)),p=Math.max(...prev.map(x=>x.e1));perf.push({id,c,p,d:(c-p)/p})});
  const up=perf.filter(x=>x.d>.005),down=perf.filter(x=>x.d<-.025),flat=perf.length-up.length-down.length;
  const ar=avgOf(wk.flatMap(h=>h.exercises.flatMap(e=>e.sets.filter(s=>!isW(s)&&hasRir(s)).map(s=>+s.rir))));
  const dl=new Set(arr(S.settings.deloads));let run=0,w=a;const wks=new Set(S.history.map(h=>weekStart(h.date)));while(wks.has(w)&&!dl.has(w)){run++;w=weekStart(w-3*864e5)}
  let deload=!dl.has(a)&&wk.length>0&&((down.length>=2&&down.length>=perf.length*.4)||(run>=6&&perf.length>=3&&down.length+flat>=perf.length*.6)||(ar!=null&&ar<=.5&&down.length>=1&&run>=4));
  const dipOnly=deload&&!(run>=6&&perf.length>=3&&down.length+flat>=perf.length*.6);let cycSoft=false;
  if(deload&&cycOn()&&(cyc().st==='preg'||(dipOnly&&cycWeek(a,b)))){deload=false;cycSoft=true}
  const used=new Set(S.history.filter(h=>h.date>=b-21*864e5&&h.routineId).map(h=>h.routineId));let rts=S.routines.filter(r=>used.has(r.id));if(!rts.length)rts=[];
  const under=wk.length?MAJOR.filter(m=>(v[m]||0)<tg[0]-1):[],over=MAJOR.filter(m=>(v[m]||0)>tg[1]+2&&(down.some(x=>musclesOf(x.id).p.includes(m))||(ar!=null&&ar<=.75)));
  const changes=[],seen=new Set();
  if(!deload){
    under.forEach(m=>rts.forEach(r=>{const c=r.exercises.filter(e=>musclesOf(e.exId).p.includes(m)&&e.sets<6&&exType(e.exId)!=='dt').sort((x,y)=>musclesOf(x.exId).p.length-musclesOf(y.exId).p.length)[0];if(!c)return;const key=r.id+c.exId;if(seen.has(key))return;seen.add(key);changes.push({k:'add',m,rid:r.id,exId:c.exId})}));
    over.forEach(m=>rts.forEach(r=>{const c=r.exercises.filter(e=>musclesOf(e.exId).p.includes(m)&&e.sets>2).sort((x,y)=>y.sets-x.sets)[0];if(!c)return;const key=r.id+c.exId;if(seen.has(key))return;seen.add(key);changes.push({k:'cut',m,rid:r.id,exId:c.exId})}));
  }
  return{a,b,n:wk.length,days:P().days,v,tg,perf,up,down,flat,ar,run,under,over,changes,deload,cycSoft,rts:rts.length};
}
const ckSeen=()=>{try{return +localStorage.getItem('replog.ck')||0}catch(e){return 0}};
function ckDismiss(a){try{localStorage.setItem('replog.ck',String(a))}catch(e){}}
const wkLabel=(a,b)=>new Date(a).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'–'+new Date(b-864e5).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function ckHeadline(c){if(!c.n)return 'No workouts last week — this week is a fresh start.';if(c.deload)return 'Performance dipped — a lighter week is recommended.';if(c.cycSoft&&!c.changes.length)return cyc().st==='preg'?'Some lifts dipped. That’s expected now. Keep it comfortable.':'A small dip during a tough-symptom week is normal. No deload needed.';if(c.changes.length)return `${c.changes.length} small routine tweak${c.changes.length>1?'s':''} suggested.`;return c.up.length?'You’re progressing — keep the plan as is.':'On track — keep going.'}
function homeCheckin(){
  let out='';
  if(inDeload())out+=`<div class="ordcard"><div class="ttl">Deload week · until ${fmtDate(num(S.settings.deloadUntil))}</div><div class="mut sm" style="margin:4px 0 8px">Routines start with half the sets at your usual weights, and no weight increases. Recover, then come back stronger.</div><button class="btn ghost sm" data-act="deloadEnd">End deload early</button></div>`;
  const c=checkin();if(!c||ckSeen()===c.a)return out;
  return out+`<div class="goalcard ck"><div class="row" style="justify-content:space-between;align-items:center"><div class="ttl">Weekly check-in</div><span class="mut sm">${wkLabel(c.a,c.b)}</span></div>
  <div class="mut sm" style="margin:4px 0 8px">${c.n} of ${c.days} planned workouts${c.perf.length?` · ${c.up.length} lift${c.up.length===1?'':'s'} up, ${c.down.length} down`:''}${c.ar!=null?` · avg ${R1c(c.ar)} reps left`:''}<br><b style="color:var(--txt)">${ckHeadline(c)}</b></div>
  <div class="row"><button class="btn acc sm" data-act="ckOpen">Review</button><button class="btn ghost sm" data-act="ckDismiss" data-v="${c.a}">Dismiss</button></div></div>`;
}
function ckSheet(){
  const c=checkin();if(!c){openModal(`<h2>Weekly check-in</h2><div class="mut">${hasGoal()?'Train for at least two weeks and your first check-in appears here.':'Set your goal in More → Training profile to get weekly coaching.'}</div><button class="btn ghost full" style="margin-top:12px" data-act="close">Close</button>`);return}
  const st=x=>x<c.tg[0]-1?'<span class="st lo">low</span>':x>c.tg[1]+2?'<span class="st hi">high</span>':'<span class="st ok">good</span>';
  const ch=c.changes.map(x=>{const r=S.routines.find(y=>y.id===x.rid);return `<li>${x.k==='add'?'Add a set':'Drop a set'} of <b>${esc(exName(x.exId))}</b> in “${esc(r?r.name:'')}” <span class="mut">(${MUS[x.m].toLowerCase()} ${x.k==='add'?'below':'above'} target${x.k==='cut'?' and not recovering':''})</span></li>`}).join('');
  openModal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Weekly check-in</h2><button class="ic" data-act="close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div><div class="mut sm">${wkLabel(c.a,c.b)} · ${c.n} of ${c.days} planned workouts</div>
  ${c.deload?`<div class="card stall" style="margin-top:12px"><div class="ttl">Take a lighter week</div><div class="sm" style="margin:4px 0 10px">${c.down.length?`${c.down.length} of your lifts went down compared with the previous month`:`You’ve trained hard ${c.run} weeks in a row and progress has flattened`}${c.ar!=null&&c.ar<=.75?', and most sets went close to failure':''}. That’s a classic sign of built-up fatigue. A deload — about a week at roughly half the sets — lets it clear. Coaches typically schedule one every 4–6 weeks.</div><button class="btn acc sm full" data-act="deloadStart">Start a deload week</button></div>`:''}
  ${c.changes.length?`<div class="card" style="margin-top:12px"><div class="ttl">Suggested tweaks</div><ul class="cklist">${ch}</ul><button class="btn acc sm full" data-act="ckApply">Apply to my routines</button><div class="mut sm" style="margin-top:6px">Small steps: one set at a time, so you can see how you recover.</div></div>`:!c.deload&&c.n?`<div class="card" style="margin-top:12px"><div class="ttl">No changes needed</div><div class="mut sm">${c.up.length?'Your lifts are moving up — the best sign your plan is working.':'Volume is in range. Keep showing up.'}${!c.rts&&c.under.length?' (Start workouts from a routine and I can tweak it for you.)':''}</div></div>`:''}
  <div class="lbl">Hard sets per muscle (target ${c.tg[0]}–${c.tg[1]})</div>${MAJOR.map(m=>`<div class="mbar"><span>${MUS[m]}</span><div style="width:${Math.min(100,100*(c.v[m]||0)/(c.tg[1]+4))}%"></div><b>${R1c(c.v[m]||0)}</b>${st(c.v[m]||0)}</div>`).join('')}
  ${c.perf.length?`<div class="lbl">Lifts vs. the previous 4 weeks</div>${c.perf.sort((x,y)=>y.d-x.d).map(x=>`<div class="li" data-act="liftEx" data-id="${x.id}"><span>${esc(exName(x.id))}</span><b class="sm ${x.d>.005?'acc':x.d<-.025?'red':'mut'}">${x.d>0?'+':''}${R1c(x.d*100)}%</b></div>`).join('')}`:''}
  ${c.ar!=null?`<div class="mut sm" style="margin-top:10px">Average effort: ${R1c(c.ar)} reps left in the tank${c.ar>3?' — you can push a bit harder':c.ar<.75?' — mostly to failure, watch your recovery':' — right in the productive zone'}.</div>`:`<div class="mut sm" style="margin-top:10px">Tip: rate how many reps you had left after each set and the check-in gets smarter.</div>`}
  <button class="btn ghost full" style="margin-top:12px" data-act="ckDismiss" data-v="${c.a}">Done for this week</button>`);
}
function ckApply(){const c=checkin();if(!c||!c.changes.length)return;const snap=clone(S.routines),now=Date.now();
  c.changes.forEach(x=>{const r=S.routines.find(y=>y.id===x.rid);if(!r)return;const e=r.exercises.find(y=>y.exId===x.exId);if(!e)return;e.sets=Math.max(1,Math.min(20,e.sets+(x.k==='add'?1:-1)));r.u=now});
  ckDismiss(c.a);saveMeta();closeModal();render();toast('Routines updated',()=>{S.routines=snap;S.routines.forEach(r=>r.u=Date.now()+1);saveMeta();render()})}
function deloadStart(){S.settings.deloadUntil=Date.now()+7*864e5;S.settings.deloads=[...arr(S.settings.deloads),weekStart(Date.now())].slice(-12);S.settings.u=Date.now();const c=checkin();if(c)ckDismiss(c.a);saveMeta();closeModal();render();toast('Deload week started — half the sets for 7 days')}

(function(){const sh=document.getElementById('sheet');if(!sh)return;let st=null;
  sh.addEventListener('touchstart',e=>{const t=e.target;if(e.touches.length>1||t.closest('canvas,input,textarea,select,.cmp,.chips,[data-nodrag]')){st=null;return}st={y:e.touches[0].clientY,x:e.touches[0].clientX,t:performance.now(),dy:0,on:false,top:sh.scrollTop<=0}},{passive:true});
  sh.addEventListener('touchmove',e=>{if(!st)return;const y=e.touches[0].clientY,dy=y-st.y,dx=e.touches[0].clientX-st.x;
    if(!st.on){if(!st.top||sh.scrollTop>0||Math.abs(dx)>Math.abs(dy)||dy<-4){st=null;return}if(dy<7)return;st.on=true;st.y0=y;st.t=performance.now();sh.classList.add('drag')}
    const d=y-st.y0;st.dy=d;sh.style.transform=`translateY(${d>0?d:d*.15}px)`;e.preventDefault()},{passive:false});
  const end=()=>{if(!st||!st.on){st=null;return}const v=st.dy/Math.max(1,performance.now()-st.t);sh.classList.remove('drag');sh.style.transform='';if(st.dy>120||(v>.45&&st.dy>24))closeModal();st=null};

function convertUnits(to){
  const toLb=to==='lb',f=toLb?2.20462:1/2.20462,fd=toLb?0.621371:1/0.621371,rw=v=>toLb?Math.round(v*f*2)/2:Math.round(v*f*4)/4;
  S.history.forEach(h=>{h.exercises.forEach(e=>e.sets.forEach(s=>{if(s.w)s.w=rw(s.w);if(s.d)s.d=R2(s.d*fd)}));saveWorkout(h)});
  if(S.active)S.active.exercises.forEach(e=>e.sets.forEach(s=>{if(num(s.w))s.w=String(rw(num(s.w)));if(num(s.d))s.d=String(R2(num(s.d)*fd))}));
  S.bw.forEach(b=>{b.w=R2(b.w*f);b.u=Date.now()});
  S.meas.forEach(m=>{if(m.k!=='bf'){m.v=R2(toLb?m.v/2.54:m.v*2.54);m.u=Date.now()}});if(S.settings.bwGoal)S.settings.bwGoal=R2(S.settings.bwGoal*f);
  S.settings.bar=toLb?(S.settings.bar===20?45:rw(S.settings.bar)):(S.settings.bar===45?20:rw(S.settings.bar));
  S.settings.inc=toLb?(S.settings.inc===2.5?5:rw(S.settings.inc)):(S.settings.inc===5?2.5:rw(S.settings.inc));
}

    case 'reSwap':swapSheet({target:'routine',i});break;

      if(done){const keep=!!(cb&&cb.checked);ask('Swap after logging sets?','The sets you already ticked for this exercise will be cleared (you can undo).','Swap',()=>doSwap(d.id,keep),false)}else go();break}
    case 'swapInfo':exInfo(d.id,{swap:ui.swap});break;
    case 'swapAll':{const ctx=ui.swap;closeModal();openPicker(ctx.target==='workout'?'replace':'rreplace',ctx.i);break}
    case 'exHistory':ui.progEx=a.exercises[i].exId;ui.ptab='ex';ui.progMetric=null;closeModal();ui.view='progress';render();window.scrollTo(0,0);break;
    case 'exMove':{const k=i+(+d.d);closeModal();if(k<0||k>=a.exercises.length)break;[a.exercises[i],a.exercises[k]]=[a.exercises[k],a.exercises[i]];saveActive();render();break}
    case 'exDel':{closeModal();const old=a.exercises.splice(i,1)[0];if(i>0&&i>=a.exercises.length)a.exercises[i-1].ss=false;saveActive();render();toast('Exercise removed',()=>{if(!S.active)return;S.active.exercises.splice(i,0,old);saveActive();render()});break}
    case 'finish':tryFinish();break;
    case 'finAll':doFinish(true);break;
    case 'finDone':doFinish(false);break;
    case 'cancelWk':if(a.editingId){S.active=null;saveActive();ui.view='history';render();break}ask('Discard workout?','Everything logged in this session will be lost.','Discard',discardWorkout);break;
    case 'rest-15':rest.end-=15000;rest.total=Math.max(1,rest.total-15);persistRest();tickRest();if(ui.gym)gymRender();break;
    case 'rest+15':rest.end+=15000;rest.total+=15;persistRest();tickRest();if(ui.gym)gymRender();break;
    case 'restSkip':stopRest();if(ui.gym)gymRender();break;
    /* --- picker --- */
    case 'pg':ui.pick.g=d.v;renderPicker();break;
    case 'pPick':pickExercise(d.id);break;
    case 'pCustom':customSheet(ui.pick.q.trim(),Object.assign({},ui.pick));break;
    case 'newCustom':customSheet('',null);break;
    case 'nxg':ui.newEx.group=d.v;renderCustomSheet();break;
    case 'nxt':ui.newEx.type=d.v;renderCustomSheet();break;
    case 'nxm':{const m=ui.newEx.mus=arr(ui.newEx.mus);const k=m.indexOf(d.v);if(k>=0)m.splice(k,1);else m.push(d.v);renderCustomSheet();break}
    case 'exInfo':exInfo(d.id);break;
    case 'libTab':ui.lib=d.v;ui.preview=null;render();window.scrollTo(0,0);break;
    case 'libEx':ui.view='routines';ui.lib='ex';ui.preview=null;ui.edit=null;render();window.scrollTo(0,0);break;
    case 'libG':ui.lg=d.v;document.querySelectorAll('#lchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===d.v));$('#liblist').innerHTML=libList();break;
    case 'pvOpen':ui.view='routines';ui.lib='rt';ui.preview=d.id;ui.edit=null;render();window.scrollTo(0,0);break;
    case 'pvBack':ui.preview=null;render();window.scrollTo(0,0);break;
    case 'pvOrder':{const r=S.routines.find(x=>x.id===ui.preview);if(!r)break;const ids=suggestedOrder(r.exercises.map(e=>e.exId)),pool=[...r.exercises];r.exercises=ids.map(id=>pool.splice(pool.findIndex(e=>e.exId===id),1)[0]);r.u=Date.now();saveMeta();render();toast('Routine reordered');break}
    case 'infoToWk':{if(!S.active)break;S.active.exercises.push(exFresh(d.id));saveActive();closeModal();toast('Added to your workout');ui.pendingRender=true;render();break}
    case 'infoToRt':{const id=d.id;openModal(`<h2>Add ${esc(exName(id))} to…</h2><div class="menu">${S.routines.map(r=>`<button data-act="infoRtPick" data-id="${id}" data-r="${r.id}">${esc(r.name)} <span class="mut sm">${r.exercises.length} exercises</span></button>`).join('')}<button data-act="infoRtNew" data-id="${id}">+ New routine with this exercise</button></div>`);break}
    case 'infoRtPick':{const r=S.routines.find(x=>x.id===d.r);if(!r)break;r.exercises.push(routineEx(d.id));r.u=Date.now();saveMeta();closeModal();render();const iss=orderIssues(r.exercises.map(e=>e.exId)).filter(x=>x.sev>0&&(x.a===d.id||x.b===d.id));toast(iss.length?'Added — see order tips in the routine':'Added to '+r.name);break}
    case 'infoRtNew':closeModal();ui.edit={id:'r'+uid(),name:'',notes:'',exercises:[routineEx(d.id)],isNew:true};ui.view='routines';ui.preview=null;render();window.scrollTo(0,0);break;
    case 'infoProg':ui.progEx=d.id;ui.ptab='ex';ui.progMetric=null;closeModal();ui.view='progress';render();window.scrollTo(0,0);break;
    case 'figView':playView(d.id,d.v);break;
    case 'cam3':cam3(d.v);break;
    case 'exInfoPick':{const st=Object.assign({},ui.pick);exInfo(d.id,st);break}
    case 'infoBack':{const st=ui.infoBack;if(st&&st.swap)swapSheet(st.swap);else if(st)openPicker(st.target,st.idx,st);else closeModal();break}
    case 'infoAdd':{const st=ui.infoBack;ui.infoBack=null;if(st&&st.swap){ui.swap=st.swap;doSwap(d.id,false)}else if(st){ui.pick=st;pickExercise(d.id,st)}break}
    case 'profile':profileSheet();break;
    case 'profSet':{const p=ui.prof;p[d.k]=d.k==='days'?+d.v:d.v;$(d.k==='goal'?'#pg':d.k==='exp'?'#pe':d.k==='days'?'#pd':d.k==='split'?'#ps':'#pq').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===String(p[d.k])));break}
    case 'profSave':{const p=ui.prof;if(!GOALS[p.goal]){toast('Pick a goal first');break}S.profile=sanitizeProfile(Object.assign({},p,{u:Date.now()}));saveMeta();render();planSheet();break}
    case 'plan':if(hasGoal())planSheet();else profileSheet();break;
    case 'genPlan':{const rs=buildPlan();ask('Add '+rs.length+' routines?','They’ll be added alongside your current routines: '+rs.map(r=>esc(r.name)).join(', ')+'. Sets, reps and rest follow your goal.','Add routines',()=>{S.routines.push(...rs);saveMeta();ui.view='routines';ui.edit=null;render();window.scrollTo(0,0);toast('Routines added')},false);break}
    case 'applyAll':ask('Apply targets to all routines?','Sets, rep ranges and rest times in every routine will be set to your goal’s recommendations. Exercises and order stay the same.','Apply',()=>{const now=Date.now();S.routines.forEach(r=>{r.exercises=r.exercises.map(e=>Object.assign({},e,routineEx(e.exId)));r.u=now});saveMeta();render();toast('Routines updated')},false);break;
    case 'reApply':ui.edit.exercises=ui.edit.exercises.map(e=>Object.assign({},e,routineEx(e.exId)));render();toast('Targets applied — save to keep');break;
    case 'reOrder':{const ids=suggestedOrder(ui.edit.exercises.map(e=>e.exId));const pool=[...ui.edit.exercises];ui.edit.exercises=ids.map(id=>pool.splice(pool.findIndex(e=>e.exId===id),1)[0]);render();toast('Reordered — save to keep');break}
    case 'wkOrder':{const pi=pendingIdx(),ex=a.exercises,sub=pi.map(i=>ex[i]),ids=suggestedOrder(sub.map(e=>e.exId)),pool=[...sub];const sorted=ids.map(id=>pool.splice(pool.findIndex(e=>e.exId===id),1)[0]);pi.forEach((i,n)=>ex[i]=sorted[n]);saveActive();render();toast('Remaining exercises reordered');break}
    case 'nxSave':{const n=ui.newEx;const name=(n.name||'').trim();if(!name){toast('Give it a name');break}
      const c={id:'c-'+uid(),name:name.slice(0,60),group:n.group,type:n.type,mus:arr(n.mus),u:Date.now()};S.customEx.push(c);saveMeta();
      if(n.then)pickExercise(c.id,n.then);else{closeModal();render()}toast('Exercise created');break}
    /* --- routines --- */
    case 'newRoutine':ui.edit={id:'r'+uid(),name:'',notes:'',exercises:[],isNew:true};ui.view='routines';render();window.scrollTo(0,0);break;
    case 'editRoutine':{const r=S.routines.find(x=>x.id===d.id);if(!r)break;ui.edit=clone(r);ui.view='routines';render();window.scrollTo(0,0);break}
    case 'dupRoutine':{const r=S.routines.find(x=>x.id===d.id);if(!r)break;const c=clone(r);c.id='r'+uid();c.name=r.name+' (copy)';c.u=Date.now();S.routines.splice(S.routines.indexOf(r)+1,0,c);saveMeta();render();toast('Routine duplicated');break}
    case 'reAdd':openPicker('routine');break;
    case 'reMove':{const ex=ui.edit.exercises,k=i+(+d.d);if(k<0||k>=ex.length)break;[ex[i],ex[k]]=[ex[k],ex[i]];render();break}
    case 'reDel':ui.edit.exercises.splice(i,1);render();break;
    case 'reCancel':ui.edit=null;render();break;
    case 'reSave':{const r=ui.edit;r.name=(r.name||'').trim()||'My routine';delete r.isNew;r.u=Date.now();const ix=S.routines.findIndex(x=>x.id===r.id);if(ix>=0)S.routines[ix]=r;else S.routines.push(r);delete S.tomb[r.id];ui.edit=null;ui.preview=r.id;saveMeta();render();window.scrollTo(0,0);toast('Routine saved');break}
    case 'reDelete':{const r=S.routines.find(x=>x.id===ui.edit.id);ui.edit=null;if(!r){render();break}const ix=S.routines.indexOf(r);S.routines.splice(ix,1);S.tomb[r.id]=Date.now();saveMeta();render();
      toast('Routine deleted',()=>{r.u=Date.now()+1;delete S.tomb[r.id];S.routines.splice(ix,0,r);saveMeta();render()});break}
    case 'updRoutine':{const h=S.history.find(x=>x.id===d.id),r=h&&S.routines.find(x=>x.id===h.routineId);if(!r)break;r.exercises=routineFromWorkout(h,r);r.u=Date.now();saveMeta();closeModal();render();toast('Routine updated');break}
    /* --- history --- */
    case 'openHist':{const h=S.history.find(x=>x.id===d.id);if(h)openModal(histDetail(h));break}
    case 'histDel':{closeModal();const h=deleteWorkout(d.id);render();if(h)toast('Workout deleted',()=>{delete S.tomb[h.id];S.history.push(h);sortHistory();saveWorkout(h);render()});break}
    case 'histRepeat':{const h=S.history.find(x=>x.id===d.id);if(!h)break;closeModal();startWorkout(h.name,h.exercises.map(e=>({exId:e.exId,note:'',rest:0,ss:false,bump:0,sets:e.sets.map(s=>newSet(0,s.k))})),h.routineId);break}
    case 'histEdit':{const h=S.history.find(x=>x.id===d.id);if(!h||S.active)break;closeModal();
      S.active={editingId:h.id,name:h.name,notes:h.notes||'',startedAt:h.date,routineId:h.routineId||null,exercises:h.exercises.map(e=>({exId:e.exId,note:e.note||'',rest:0,ss:false,bump:0,sets:e.sets.map(s=>({w:s.w?String(s.w):'',r:s.r?String(s.r):'',t:s.t?String(s.t):'',d:s.d?String(s.d):'',k:s.k||'',done:true,tr:0,rir:hasRir(s)?+s.rir:null}))}))};
      saveActive();ui.view='home';render();window.scrollTo(0,0);break}
    case 'histToRoutine':{const h=S.history.find(x=>x.id===d.id);if(!h)break;S.routines.push({id:'r'+uid(),name:h.name,notes:'',u:Date.now(),exercises:routineFromWorkout(h,null)});saveMeta();closeModal();render();toast('Saved to routines');break}
    case 'histCopy':{const h=S.history.find(x=>x.id===d.id);if(h)copyText(histText(h),'Workout copied');break}
    /* --- progress --- */
    case 'metric':ui.progMetric=d.v;render();break;
    /* --- tools --- */
    case 'toolPlate':loaderSheet({});break;
    case 'tool1rm':rmSheet();break;
    case 'toolBw':bwSheet();break;
    case 'toolTimer':primeAudio();timerSheet();break;
    case 'timerGo':primeAudio();startRest(+d.v,'Timer');closeModal();break;
    case 'bwAdd':{const v=num($('#bwin').value);if(!v){toast('Enter a weight');break}const t=fromIso(($('#bwdate')||{}).value);S.bw.push({id:'b'+uid(),date:t,w:R2(v),u:Date.now()});S.bw.sort((x,y)=>x.date-y.date);saveMeta();bwSheet();toast('Logged');ui.pendingRender=true;break}
    case 'bwDel':{const b=S.bw.find(x=>x.id===d.id);S.bw=S.bw.filter(x=>x.id!==d.id);S.tomb[d.id]=Date.now();saveMeta();bwSheet();ui.pendingRender=true;if(b)toast('Entry deleted',()=>{b.u=Date.now()+1;delete S.tomb[b.id];S.bw.push(b);S.bw.sort((x,y)=>x.date-y.date);saveMeta();bwSheet()});break}
    /* --- settings --- */
    case 'units':{if(d.v===S.settings.units)break;const has=S.history.length||S.bw.length;if(!has){setUnits(d.v,false);break}
      openModal(`<h2>Switch to ${d.v}?</h2><div class="mut">Convert your existing weights${S.history.some(h=>h.exercises.some(e=>exType(e.exId)==='dt'))?' and distances':''}, or keep the numbers as they are and only change the label?</div><div class="menu"><button data-act="unitsGo" data-v="${d.v}" data-c="1">Convert my numbers</button><button data-act="unitsGo" data-v="${d.v}" data-c="">Just change the label</button><button data-act="close">Cancel</button></div>`);break}
    case 'unitsGo':setUnits(d.v,!!d.c);break;
    case 'moreGo':ui.more=d.v;ui.navDir='fwd';render();window.scrollTo(0,0);break;
    case 'moreBack':ui.more=null;ui.navDir='back';render();window.scrollTo(0,0);break;
    case 'restDef':S.settings.rest=+d.v;S.settings.u=Date.now();saveMeta();render();break;
    case 'tog':S.settings[d.k]=!S.settings[d.k];S.settings.u=Date.now();saveMeta();render();if(d.k==='awake')keepAwake(S.settings.awake);break;
    case 'syncNow':if(!coll){toast(SYNC_TXT[sync.st]);break}backoff=2000;flushSoon(0);toast('Syncing…');break;
    case 'dlJson':saveFile('plato-backup-'+new Date().toISOString().slice(0,10)+'.json',backupText());break;
    case 'dlCsv':saveFile('plato-workouts-'+new Date().toISOString().slice(0,10)+'.csv',csvText());break;
    case 'copyBk':{const t=backupText();const b=$('#bk');if(b)b.value=t;copyText(t,'Backup copied');break}
    case 'impFile':$('#impf').click();break;
    case 'impPaste':importData(($('#bk')||{}).value||'');break;
    case 'impMerge':applyImport(false);break;
    case 'impReplace':applyImport(true);break;
    case 'delCustom':{const c=S.customEx.find(x=>x.id===d.id);if(!c)break;const used=S.history.filter(h=>h.exercises.some(e=>e.exId===c.id)).length;
      ask('Delete “'+esc(c.name)+'”?',used?`It’s in ${used} logged workout${used>1?'s':''}, which will show it as “Deleted exercise”.`:'It isn’t used in any workouts.','Delete',()=>{S.customEx=S.customEx.filter(x=>x.id!==c.id);S.tomb[c.id]=Date.now();saveMeta();render()});break}
    case 'resetAll':ask('Erase everything?','All workouts, routines, body weight and settings will be deleted on every device. Download a backup first if you might want it.','Erase all',()=>{
      const now=Date.now();S.history.forEach(h=>{S.tomb[h.id]=now;Q.del.add(h.id)});[...S.routines,...S.customEx,...S.bw].forEach(x=>{S.tomb[x.id]=now});
      const tomb=S.tomb;stopRest();S=defaults();S.tomb=tomb;S.fresh=false;S.routines.forEach(r=>r.u=now+1);S.settings.u=now+1;S.activeU=now;Q.active=true;Q.w.clear();saveMeta();ui.view='home';render();toast('All data erased')});break;
  }
}

document.addEventListener('input',ev=>{
  const t=ev.target,f=t.dataset.f;if(!f)return;const i=+t.dataset.i,j=+t.dataset.j,a=S.active;
  switch(f){
    case 'wname':a.name=t.value;saveActive();break;
    case 'gym':{if(!a||!ui.gym)break;const s=a.exercises[ui.gym.i].sets[ui.gym.j],k=t.dataset.k;const v=t.value.replace(',','.').replace(/[^0-9.]/g,'');if(k==='tm')s.t=v===''?'':String(Math.round(num(v)*60));else s[k]=v;saveActive();const gl=$('.gload');if(gl&&k==='w'&&num(v))gl.textContent=loadText(a.exercises[ui.gym.i].exId,num(v));ui.pendingRender=true;break}
    case 'camOp':{CAM.op=+t.value/100;const g=$('#camg');if(g)g.style.opacity=CAM.op;break}
    case 'wnote':a.notes=t.value;saveActive();break;
    case 'sv':{const s=a.exercises[i].sets[j];const k=t.dataset.k;let v=t.value.replace(',','.').replace(/[^0-9.]/g,'');if(k==='tm'){s.t=v===''?'':String(Math.round(num(v)*60))}else s[k]=v;if(v!==t.value.replace(',','.'))t.value=v;saveActive();refreshPH(i);{const ex=S.active.exercises[i],ll=$('#ld-'+i);if(ll&&k==='w'){const jj=ex.sets.findIndex(x=>!x.done);if(jj===j)ll.innerHTML=ldLineInner(ex.exId,num(t.value)||suggestion(ex,j).out.w,j)}}const w=$('#wstat');if(w)w.textContent=wstat();break}
    case 'exnote':a.exercises[i].note=t.value;saveActive();ui.pendingRender=true;break;
    case 'rname':ui.edit.name=t.value;break;
    case 'rnote':ui.edit.notes=t.value;break;
    case 'rx':{const e=ui.edit.exercises[i],k=t.dataset.k,v=parseInt(t.value)||0;e[k]=k==='sets'?Math.max(1,Math.min(20,v||1)):Math.max(0,Math.min(k==='rest'?900:9999,v));break}
    case 'pq':ui.pick.q=t.value;renderPicker();break;
    case 'nxname':ui.newEx.name=t.value;break;
    case 'prof':ui.prof[t.dataset.k]=t.value;break;
    case 'profft':case 'profin':{const ft=num(($('[data-f=profft]')||{}).value),inch=num(($('[data-f=profin]')||{}).value);ui.prof.hcm=Math.round((ft*12+inch)*2.54);break}
    case 'hq':ui.hq=t.value;$('#hlist').innerHTML=histList();break;
    case 'cmpP':{const b=$('#cmpbox');if(b)b.style.setProperty('--p',t.value+'%');break}
    case 'lq':ui.lq=t.value;$('#liblist').innerHTML=libList();break;
    case 'plw':ui.plate.w=t.value;renderPlates();break;
    case 'plb':ui.plate.bar=t.value;renderPlates();break;
    case 'orw':ui.rm.w=t.value;renderRM();break;
    case 'orr':ui.rm.r=t.value;renderRM();break;
    case 'ldt':{const v=num(t.value);if(v){ui.ld.plates=platesFor(v,ui.ld.bar,ui.ld.sides).used;const keep=t.value;renderLoader();const ni=$('[data-f=ldt]');if(ni){ni.value=keep;ni.focus()}}break}
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target,f=t.dataset.f;
  if(f==='progEx'){ui.progEx=t.value;ui.progMetric=null;render()}
  else if(f==='cmpA'||f==='cmpB'){ui.cmp=ui.cmp||{};ui.cmp[f==='cmpA'?'a':'b']=t.value;phCompare()}
  else if(f==='setnum'){const v=num(t.value);if(v){S.settings[t.dataset.k]=R2(v);S.settings.u=Date.now();saveMeta()}else t.value=S.settings[t.dataset.k]}
});
document.addEventListener('focusin',ev=>{if(ev.target.matches('.sr input'))setTimeout(()=>{try{ev.target.select()}catch(e){}},0)});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(ui.view==='progress')drawProgress()},150)});
window.addEventListener('error',e=>{lastError=(e.message||'error').slice(0,200)});
window.addEventListener('unhandledrejection',e=>{lastError=String(e.reason&&e.reason.message||e.reason).slice(0,200)});

setInterval(()=>{const e=$('#elapsed');if(e&&S.active&&!S.active.editingId)e.textContent=fmtElapsed(Date.now()-S.active.startedAt)},1000);

migrateRest();persist();applyTheme();
if(STANDALONE){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
render();
if(S.active)keepAwake(true);
initSync();
checkRoutineHash();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{
  r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){try{toast('Plato updated \u2014 it\u2019ll use the new version next time you open it')}catch(e){}}})});
}).catch(()=>{})})}
</script>
